<rect x="48.0" y="9.0" width="12.0" height="12.0" rx="2" class="s-before solid"/>
<text x="66.0" y="19.0" text-anchor="start" class="label">69 °C</text>
<rect x="117.5" y="9.0" width="12.0" height="12.0" rx="2" class="s-after solid"/>
<text x="135.5" y="19.0" text-anchor="start" class="label">60 °C, −6 K</text>
<rect x="234.4" y="9.0" width="12.0" height="12.0" rx="2" class="s-after2 solid"/>
<text x="252.4" y="19.0" text-anchor="start" class="label">60 °C, −10 K</text>
<line x1="448.0" y1="12.0" x2="472.0" y2="12.0" class="marker"/>
