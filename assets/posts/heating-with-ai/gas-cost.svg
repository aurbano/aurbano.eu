<svg viewBox="8.1 0 680 348" role="img" aria-labelledby="gas-cost-t gas-cost-d" xmlns="http://www.w3.org/2000/svg">
<title id="gas-cost-t">Gas cost per degree of warmth, per day</title>
<desc id="gas-cost-d">Bars per day from 10 to 18 November: what the day's gas cost, divided by how many degrees warmer the house was than outside. A marker on each complete day shows what the old settings would have cost on the same day. 10 and 11 November sit 4 % and 11 % above their markers; 17 November, the only complete day at the new settings, is 8 % above its marker.</desc>
