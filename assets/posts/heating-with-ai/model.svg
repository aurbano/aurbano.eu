<svg viewBox="0 0 680 470" role="img" aria-labelledby="model-t model-d" xmlns="http://www.w3.org/2000/svg">
<title id="model-t">How expected gas is worked out</title>
<desc id="model-d">Four inputs (indoor minus outdoor temperature, sunshine, wind, weekend) feed a model fitted at the old boiler settings. Its expected gas is compared with the smart meter each day, and the differences are added up. Heating hours are left out because they change with the flow temperature.</desc>
<defs><marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs>
<rect x="0.0" y="10.0" width="180.0" height="62.0" rx="10" class="box"/>
<text x="14.0" y="35.0" text-anchor="start" class="d-title">Indoor − outdoor</text>
<text x="14.0" y="56.0" text-anchor="start" class="d-note">6 rooms vs outside</text>
<path d="M182,41 L224,133" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="0.0" y="86.0" width="180.0" height="62.0" rx="10" class="box"/>
<text x="14.0" y="111.0" text-anchor="start" class="d-title">Sunshine</text>
<text x="14.0" y="132.0" text-anchor="start" class="d-note">weather archive</text>
<path d="M182,117 L224,151" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="0.0" y="162.0" width="180.0" height="62.0" rx="10" class="box"/>
<text x="14.0" y="187.0" text-anchor="start" class="d-title">Wind</text>
<text x="14.0" y="208.0" text-anchor="start" class="d-note">weather archive</text>
<path d="M182,193 L224,169" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="0.0" y="238.0" width="180.0" height="62.0" rx="10" class="box"/>
<text x="14.0" y="263.0" text-anchor="start" class="d-title">Weekend</text>
<text x="14.0" y="284.0" text-anchor="start" class="d-note">more people home</text>
<path d="M182,269 L224,187" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="228.0" y="40.0" width="222.0" height="214.0" rx="10" class="box box-accent"/>
<text x="242.0" y="65.0" text-anchor="start" class="d-title">Old-settings model</text>
<text x="242.0" y="86.0" text-anchor="start" class="d-note">+6.2 per °C indoor − outdoor</text>
<text x="242.0" y="104.0" text-anchor="start" class="d-note">−8.0 per kWh/m² of sun</text>
<text x="242.0" y="122.0" text-anchor="start" class="d-note">+1.3 per km/h of wind</text>
<text x="242.0" y="140.0" text-anchor="start" class="d-note">+7.0 at weekends</text>
<text x="242.0" y="158.0" text-anchor="start" class="d-note">−12.7 to start from</text>
<text x="242.0" y="176.0" text-anchor="start" class="d-note">kWh per day, fitted on</text>
<text x="242.0" y="194.0" text-anchor="start" class="d-note">40 days at 69 °C</text>
<text x="242.0" y="238.0" text-anchor="start" class="d-note warn">typical error ±10 kWh/day</text>
<rect x="492.0" y="10.0" width="188.0" height="62.0" rx="10" class="box box-accent"/>
<text x="506.0" y="35.0" text-anchor="start" class="d-title">Expected gas</text>
<text x="506.0" y="56.0" text-anchor="start" class="d-note">at the old settings</text>
<path d="M452,110 L490,60" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="492.0" y="120.0" width="188.0" height="62.0" rx="10" class="box"/>
<text x="506.0" y="145.0" text-anchor="start" class="d-title">Difference</text>
<text x="506.0" y="166.0" text-anchor="start" class="d-note">expected − measured</text>
<rect x="492.0" y="230.0" width="188.0" height="62.0" rx="10" class="box"/>
<text x="506.0" y="255.0" text-anchor="start" class="d-title">Measured gas</text>
<text x="506.0" y="276.0" text-anchor="start" class="d-note">smart meter</text>
<path d="M586,74 L586,118" class="arrow" marker-end="url(#model-arrow)"/>
<path d="M586,228 L586,184" class="arrow" marker-end="url(#model-arrow)"/>
<path d="M492,151 L470,151 L470,336" class="arrow" marker-end="url(#model-arrow)"/>
<rect x="360.0" y="340.0" width="320.0" height="120.0" rx="10" class="box box-accent"/>
<text x="374.0" y="365.0" text-anchor="start" class="d-title">Running total</text>
<text x="374.0" y="386.0" text-anchor="start" class="d-note">adds up the daily differences</text>
<text x="374.0" y="404.0" text-anchor="start" class="d-note">on the Boiler tab, skipping</text>
<text x="374.0" y="422.0" text-anchor="start" class="d-note">days with gaps in the data</text>
<rect x="0.0" y="340.0" width="330.0" height="120.0" rx="10" class="box box-muted"/>
<text x="14.0" y="365.0" text-anchor="start" class="d-title">Left out: heating hours</text>
<text x="14.0" y="386.0" text-anchor="start" class="d-note">at 60 °C the valves stay open longer</text>
<text x="14.0" y="404.0" text-anchor="start" class="d-note">for the same heat, so they would</text>
<text x="14.0" y="422.0" text-anchor="start" class="d-note">fake a saving</text>
</svg>
