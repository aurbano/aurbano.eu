<svg viewBox="0 0 680 356" role="img" aria-labelledby="band-t band-d" xmlns="http://www.w3.org/2000/svg">
<title id="band-t">What the restart band does</title>
<desc id="band-d">An illustration of the water temperature rising while the burner runs and falling while it rests, between the stop point at 64 °C and the restart point: 54 °C with the −6 K band, 50 °C with −10 K. Built from the median run and pause at each setting: the wider band gives longer runs, longer pauses and fewer starts.</desc>
