<title id="relay-t">Burner minutes per hour from 13 to 16 November, with the tado relay's outages shaded</title>
<desc id="relay-d">Hourly bars. The relay was offline for about 26 of the 72 hours. During the long overnight outage the burner ran about 35 minutes an hour; during the Saturday afternoon outage it did not run at all.</desc>
