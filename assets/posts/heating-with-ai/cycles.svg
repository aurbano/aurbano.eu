<svg viewBox="0 0 680 290" role="img" aria-labelledby="cycles-t cycles-d" xmlns="http://www.w3.org/2000/svg">
<title id="cycles-t">How long each burner run lasted at each setting</title>
<desc id="cycles-d">Grouped bars of run length. Lowering the flow to 60 °C left the distribution almost unchanged, about three quarters of runs under five minutes; widening the restart band to −10 K moved runs from under three minutes to three to five minutes and longer.</desc>
