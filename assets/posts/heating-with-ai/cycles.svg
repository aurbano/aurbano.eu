<rect x="200.4" y="9.0" width="12.0" height="12.0" rx="2" class="s-after solid"/>
<text x="218.4" y="19.0" text-anchor="start" class="label">60 °C, −6 K (214)</text>
<rect x="364.7" y="9.0" width="12.0" height="12.0" rx="2" class="s-after2 solid"/>
<text x="382.7" y="19.0" text-anchor="start" class="label">60 °C, −10 K (147)</text>
<line x1="44.0" y1="240.0" x2="670.0" y2="240.0" class="grid"/>
<text x="36.0" y="244.0" text-anchor="end" class="tick">0%</text>
<line x1="44.0" y1="191.5" x2="670.0" y2="191.5" class="grid"/>
<text x="36.0" y="195.5" text-anchor="end" class="tick">10%</text>
