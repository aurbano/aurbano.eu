<svg viewBox="0 0 680 290" role="img" aria-labelledby="cycles-t cycles-d" xmlns="http://www.w3.org/2000/svg">
<title id="cycles-t">How long each burner run lasted, at 69 °C and at 60 °C</title>
<desc id="cycles-d">Grouped bars of run length. The two distributions are almost identical: about three quarters of runs are shorter than five minutes either way.</desc>
<rect x="44.0" y="9.0" width="12.0" height="12.0" rx="2" class="s-before solid"/>
<text x="62.0" y="19.0" text-anchor="start" class="label">69 °C (258 cycles)</text>
<rect x="216.2" y="9.0" width="12.0" height="12.0" rx="2" class="s-after solid"/>
<text x="234.2" y="19.0" text-anchor="start" class="label">60 °C (214 cycles)</text>
<line x1="44.0" y1="240.0" x2="670.0" y2="240.0" class="grid"/>
<text x="36.0" y="244.0" text-anchor="end" class="tick">0%</text>
<line x1="44.0" y1="191.5" x2="670.0" y2="191.5" class="grid"/>
<text x="36.0" y="195.5" text-anchor="end" class="tick">10%</text>
<line x1="44.0" y1="143.0" x2="670.0" y2="143.0" class="grid"/>
<text x="36.0" y="147.0" text-anchor="end" class="tick">20%</text>
<line x1="44.0" y1="94.5" x2="670.0" y2="94.5" class="grid"/>
<text x="36.0" y="98.5" text-anchor="end" class="tick">30%</text>
<line x1="44.0" y1="46.0" x2="670.0" y2="46.0" class="grid"/>
<text x="36.0" y="50.0" text-anchor="end" class="tick">40%</text>
<rect x="56.5" y="178.0" width="22.0" height="62.0" rx="2" class="s-before solid"/>
<rect x="81.6" y="133.5" width="22.0" height="106.5" rx="2" class="s-after solid"/>
<text x="83.1" y="258.0" text-anchor="middle" class="tick">&lt;1</text>
<rect x="134.8" y="134.7" width="22.0" height="105.3" rx="2" class="s-before solid"/>
<rect x="159.8" y="110.8" width="22.0" height="129.2" rx="2" class="s-after solid"/>
<text x="161.4" y="258.0" text-anchor="middle" class="tick">1–2</text>
<rect x="213.0" y="191.1" width="22.0" height="48.9" rx="2" class="s-before solid"/>
<rect x="238.1" y="215.1" width="22.0" height="24.9" rx="2" class="s-after solid"/>
<text x="239.6" y="258.0" text-anchor="middle" class="tick">2–3</text>
<rect x="291.3" y="104.7" width="22.0" height="135.3" rx="2" class="s-before solid"/>
<rect x="316.3" y="144.8" width="22.0" height="95.2" rx="2" class="s-after solid"/>
<text x="317.9" y="258.0" text-anchor="middle" class="tick">3–5</text>
<rect x="369.5" y="166.7" width="22.0" height="73.3" rx="2" class="s-before solid"/>
<rect x="394.6" y="181.1" width="22.0" height="58.9" rx="2" class="s-after solid"/>
<text x="396.1" y="258.0" text-anchor="middle" class="tick">5–8</text>
<rect x="447.8" y="211.8" width="22.0" height="28.2" rx="2" class="s-before solid"/>
<rect x="472.8" y="219.6" width="22.0" height="20.4" rx="2" class="s-after solid"/>
<text x="474.4" y="258.0" text-anchor="middle" class="tick">8–12</text>
<rect x="526.0" y="217.4" width="22.0" height="22.6" rx="2" class="s-before solid"/>
<rect x="551.1" y="199.2" width="22.0" height="40.8" rx="2" class="s-after solid"/>
<text x="552.6" y="258.0" text-anchor="middle" class="tick">12–40</text>
<rect x="604.3" y="230.6" width="22.0" height="9.4" rx="2" class="s-before solid"/>
<rect x="629.3" y="230.9" width="22.0" height="9.1" rx="2" class="s-after solid"/>
<text x="630.9" y="258.0" text-anchor="middle" class="tick">40+</text>
<text x="357.0" y="280.0" text-anchor="middle" class="note">minutes per burner run</text>
<line x1="357.0" y1="42.0" x2="357.0" y2="240.0" class="target"/>
<text x="349.0" y="56.0" text-anchor="end" class="label strong">under 5 min: 72 % → 73 %</text>
</svg>
