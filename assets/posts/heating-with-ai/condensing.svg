<svg viewBox="0.0 0 680 350" role="img" aria-labelledby="condensing-t condensing-d" xmlns="http://www.w3.org/2000/svg">
<title id="condensing-t">What condensing means</title>
<desc id="condensing-d">Two side-by-side sketches of a condensing boiler. Exhaust from the burner rises through the main heat exchanger and then the condensing exchanger, where the cooler water coming back from the radiators enters. With the return below 55 °C the water vapour in the exhaust condenses and its heat goes into the water; above 55 °C it is too warm to condense and the heat leaves through the flue.</desc>
<defs><marker id="cond-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker><marker id="pipe-cold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="pipe-head-cold"/></marker><marker id="pipe-warm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="pipe-head-warm"/></marker><marker id="pipe-hot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="pipe-head-hot"/></marker></defs>
<rect x="0.0" y="1.0" width="334.0" height="348.0" rx="14" class="panel"/>
<text x="10.0" y="28.0" text-anchor="start" class="d-title good-text">Return below 55 °C</text>
<path d="M103,114 L103,48" class="arrow" marker-end="url(#cond-arrow)"/>
<text x="115.0" y="70.0" text-anchor="start" class="d-note">cooler, drier</text>
<text x="115.0" y="87.0" text-anchor="start" class="d-note">exhaust</text>
<rect x="10.0" y="116.0" width="186.0" height="82.0" rx="10" class="box box-accent"/>
<text x="22.0" y="136.0" text-anchor="start" class="d-title">Condensing exchanger</text>
<text x="22.0" y="154.0" text-anchor="start" class="d-note">vapour turns to water:</text>
<text x="22.0" y="169.0" text-anchor="start" class="d-note">its heat goes into the</text>
<text x="22.0" y="184.0" text-anchor="start" class="d-note">radiator water</text>
<path d="M103,232 L103,200" class="arrow" marker-end="url(#cond-arrow)"/>
<rect x="10.0" y="234.0" width="186.0" height="44.0" rx="10" class="box"/>
<text x="22.0" y="261.0" text-anchor="start" class="d-title">Main exchanger</text>
<path d="M103,294 L103,280" class="arrow" marker-end="url(#cond-arrow)"/>
<rect x="10.0" y="296.0" width="186.0" height="40.0" rx="10" class="box box-muted"/>
<text x="22.0" y="321.0" text-anchor="start" class="d-note">Burner: gas + air</text>
<path d="M322,158 L207,158" class="pipe pipe-cold" marker-end="url(#pipe-cold)"/>
<text x="208.0" y="126.0" text-anchor="start" class="d-note cool">cool water back</text>
<text x="208.0" y="141.0" text-anchor="start" class="d-note cool">from the radiators</text>
<path d="M198,256 L310,256" class="pipe pipe-hot" marker-end="url(#pipe-hot)"/>
<text x="208.0" y="280.0" text-anchor="start" class="d-note warn">hot water out to</text>
<text x="208.0" y="295.0" text-anchor="start" class="d-note warn">the radiators</text>
<rect x="346.0" y="1.0" width="334.0" height="348.0" rx="14" class="panel"/>
<text x="356.0" y="28.0" text-anchor="start" class="d-title bad-text">Return above 55 °C</text>
<path d="M449,114 L449,48" class="arrow" marker-end="url(#cond-arrow)"/>
<text x="461.0" y="70.0" text-anchor="start" class="d-note warn">hot, wet exhaust:</text>
<text x="461.0" y="87.0" text-anchor="start" class="d-note warn">that heat is lost</text>
<rect x="356.0" y="116.0" width="186.0" height="82.0" rx="10" class="box"/>
<text x="368.0" y="136.0" text-anchor="start" class="d-title">Condensing exchanger</text>
<text x="368.0" y="154.0" text-anchor="start" class="d-note">too warm to condense:</text>
<text x="368.0" y="169.0" text-anchor="start" class="d-note">the vapour passes</text>
<text x="368.0" y="184.0" text-anchor="start" class="d-note">straight through</text>
<path d="M449,232 L449,200" class="arrow" marker-end="url(#cond-arrow)"/>
<rect x="356.0" y="234.0" width="186.0" height="44.0" rx="10" class="box"/>
<text x="368.0" y="261.0" text-anchor="start" class="d-title">Main exchanger</text>
<path d="M449,294 L449,280" class="arrow" marker-end="url(#cond-arrow)"/>
<rect x="356.0" y="296.0" width="186.0" height="40.0" rx="10" class="box box-muted"/>
<text x="368.0" y="321.0" text-anchor="start" class="d-note">Burner: gas + air</text>
<path d="M668,158 L553,158" class="pipe pipe-warm" marker-end="url(#pipe-warm)"/>
<text x="554.0" y="126.0" text-anchor="start" class="d-note warm">warm water back</text>
<text x="554.0" y="141.0" text-anchor="start" class="d-note warm">from the radiators</text>
<path d="M544,256 L656,256" class="pipe pipe-hot" marker-end="url(#pipe-hot)"/>
<text x="554.0" y="280.0" text-anchor="start" class="d-note warn">hot water out to</text>
<text x="554.0" y="295.0" text-anchor="start" class="d-note warn">the radiators</text>
</svg>
