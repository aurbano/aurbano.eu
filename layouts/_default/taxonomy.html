{{ partial "header" . }}

<main id="main-content" class="flex-1 page-spacing">
  <div class="reading-shell">
    <header class="mb-8">
      <p class="eyebrow mb-3">{{ humanize .Data.Singular }}</p>
      <h1 class="page-title">{{ .Title }}</h1>
    </header>
    {{ range (.Paginator 20).Pages }}{{ partial "list-item" . }}{{ end }}
    {{ partial "paginator" . }}
  </div>
</main>

{{ partial "footer" . }}
