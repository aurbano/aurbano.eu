{{ partial "header" . }}

<main id="main-content" class="flex-1 page-spacing">
  <div class="reading-shell">
    <header class="mb-10">
      <h1 class="page-title">{{ .Title }}</h1>
    </header>

    {{ with .Pages }}
      <div class="flex flex-wrap gap-3">
        {{ range sort . }}
          <a href="{{ .RelPermalink }}" class="tag">
            {{ .Title }} <span>({{ len .Pages }})</span>
          </a>
        {{ end }}
      </div>
    {{ end }}

  </div>
</main>

{{ partial "footer" . }}
